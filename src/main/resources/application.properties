spring.application.name=CCC_FS_A

#optional git-ignored file for machine specific values such as your database password
spring.config.import=optional:classpath:application-local.properties
spring.flyway.enabled=true
#db/migration holds the schema, db/sample holds demo data (remove it to start with an empty database)
spring.flyway.locations=classpath:db/migration,classpath:db/sample

#creating the database and connecting to the postgresql default port and calling the db: fabrication
spring.datasource.url=jdbc:postgresql://localhost:5432/fabrication
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

#letting hibernate validate our db instead of creating the tables
#because flyway does that and in a form that can be submitted
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


#pagination: listing endpoints accept ?page=0&size=10&sort=field,asc, size is capped to protect the server
spring.data.web.pageable.max-page-size=100

#hardcoded users for basic authentication, planner can change data, viewer can only read
app.security.planner.username=planner
app.security.planner.password=planner123
app.security.viewer.username=viewer
app.security.viewer.password=viewer123

#the angular dev server
app.cors.allowed-origins=http://localhost:4200
