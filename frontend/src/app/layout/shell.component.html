<mat-sidenav-container class="container">
  <mat-sidenav #sidenav class="sidenav"
               [mode]="isHandset() ? 'over' : 'side'"
               [opened]="!isHandset()">
    <div class="brand">
      <mat-icon>engineering</mat-icon>
      <span>Fabrication Planning</span>
    </div>
    <mat-nav-list>
      @for (link of links; track link.path) {
        <a mat-list-item [routerLink]="link.path" routerLinkActive #active="routerLinkActive"
           [activated]="active.isActive" (click)="closeOnHandset(sidenav)">
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isHandset()) {
        <button mat-icon-button aria-label="Open menu" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      @if (auth.user(); as user) {
        <span class="user">
          <mat-icon>account_circle</mat-icon>
          <span>{{ user.username }}</span>
          <span class="role">{{ auth.canEdit() ? 'Planner' : 'Viewer (read only)' }}</span>
        </span>
      }
      <button mat-icon-button aria-label="Log out" matTooltip="Log out" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
